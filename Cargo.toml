[package]
name = "eita"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Context-aware fuzzy command suggestions for Zsh"
repository = "https://github.com/rodkisten/eita"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
frizbee = "0.13"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

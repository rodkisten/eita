name: "📦 Eita · Build & Release"

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  verify:
    name: "✅ Validate source"
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets
      - name: Installer shell syntax
        run: sh -n install.sh
      - name: Zsh plugin syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          zsh -n integrations/zsh/eita.plugin.zsh

  build:
    name: "🦀 ${{ matrix.target }}"
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          #- os: ubuntu-24.04-arm
         #   target: aarch64-unknown-linux-gnu
         # - os: macos-15-intel
         #   target: x86_64-apple-darwin
         # - os: macos-15
          #  target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain for portable Linux binaries
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Compile optimized binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"
      - name: Smoke test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/eita"
          "$binary" --version
          if [[ "$TARGET" == *linux-musl ]]; then
            ! readelf -l "$binary" | grep -q 'INTERP'
            file "$binary"
          fi
          "$binary" popup --help | grep -F -- '--height'
          "$binary" suggest --line 'git com' --format lines | grep -F 'git commit'
          "$binary" bench --iterations 10
      - name: Package binary, plugin and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          mkdir -p "$staging/integrations/zsh" dist
          cp "target/$TARGET/release/eita" "$staging/eita"
          chmod 0755 "$staging/eita"
          cp README.md LICENSE "$staging/"
          cp integrations/zsh/eita.plugin.zsh "$staging/integrations/zsh/"
          archive="eita-$TARGET.tar.gz"
          tar -czf "dist/$archive" -C "$staging" .
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          )
          rm -rf "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: eita-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: "🚀 Publish GitHub Release"
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eita-*
          merge-multiple: true
          path: dist
      - name: Validate all packages and their checksums
        shell: bash
        run: |
          set -euo pipefail
          archives="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)"
          checksums="$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)"
          test "$archives" -gt 0
          test "$archives" -eq "$checksums"
          for file in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$file")")
          done
      - name: Create or update commit-specific release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="main-${COMMIT_SHA:0:12}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$COMMIT_SHA" \
              --title "Eita · ${COMMIT_SHA:0:12}" \
              --notes "Automated build for main commit $COMMIT_SHA. Packages are published only for targets enabled by the current workflow matrix. Every archive has a matching SHA-256 checksum." \
              --latest=false
          fi
          gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
          head_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if [ "$head_sha" = "$COMMIT_SHA" ]; then
            gh release edit "$tag" --latest
            echo "Promoted $tag to latest"
          else
            echo "$tag published without replacing latest: main advanced to $head_sha"
          fi
          echo "Release: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"


  preview:
    name: "🔗 Publish installable PR preview"
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: eita-pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eita-*
          merge-multiple: true
          path: dist
      - name: Verify checksums for every downloaded archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          checksums=(dist/*.sha256)
          test "${#archives[@]}" -gt 0
          test "${#archives[@]}" -eq "${#checksums[@]}"
          for checksum in "${checksums[@]}"; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
      - name: Publish moving PR prerelease and update comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const live = (await github.rest.pulls.get({ owner, repo, pull_number: pr })).data;
            if (live.state !== 'open' || live.head.sha !== sha) {
              core.notice('Skipping superseded preview build');
              return;
            }
            const tag = 'pr-' + pr;
            const title = 'Eita PR #' + pr + ' · ' + sha.slice(0, 12);
            const notes = 'Preview of PR #' + pr + ' at commit ' + sha
              + '. Files are replaced after all build jobs pass.';
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              release = (await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, name: title, body: notes,
                prerelease: true,
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha,
                name: title, body: notes, draft: false, prerelease: true,
                make_latest: 'false',
              })).data;
            }
            const files = fs.readdirSync('dist')
              .filter(name => name.endsWith('.tar.gz') || name.endsWith('.sha256'))
              .sort();
            if (!files.some(name => name.endsWith('.tar.gz'))) throw new Error('Missing preview archive');
            const previous = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            for (const name of files) {
              const existing = previous.find(asset => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              const filename = path.join('dist', name);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: fs.readFileSync(filename),
                headers: {
                  'content-type': name.endsWith('.sha256') ? 'text/plain' : 'application/gzip',
                  'content-length': fs.statSync(filename).size,
                },
              });
            }
            await github.rest.git.updateRef({
              owner, repo, ref: 'tags/' + tag, sha, force: true,
            });
            const marker = '<!-- eita-pr-preview -->';
            const shortUrl = 'https://shell.migos.club/install/eita/pr/' + pr;
            const assetUrl = 'https://github.com/' + owner + '/' + repo
              + '/releases/download/' + tag + '/eita-x86_64-unknown-linux-musl.tar.gz';
            const lines = [
              marker, '## 🦀 Eita · preview instalável', '',
              '✅ Commit: ' + sha.slice(0, 12), '',
              '**Instalar a build mais recente deste PR:**',
              '~~~sh', 'curl -fsSL ' + shortUrl + ' | sh', '~~~', '',
              '🔗 **Instalador:** ' + shortUrl,
              '📦 **Artefato (link curto):** ' + shortUrl + '/artifact',
              '🔐 **SHA-256 (link curto):** ' + shortUrl + '/checksum',
              '🧾 **GitHub Release asset:** ' + assetUrl,
              '📝 **Prerelease:** ' + release.html_url, '',
              'Este preview é atualizado apenas após builds bem-sucedidos.',
              'O release latest da main permanece inalterado.',
            ];
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(item =>
              item.user?.type === 'Bot' && item.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## 🦀 PR preview\n\n' + shortUrl + '\n\n' + release.html_url + '\n');

  preview_cleanup:
    name: "🧹 Remove closed PR prerelease"
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tag = 'pr-' + context.payload.pull_request.number;
            try {
              const release = (await github.rest.repos.getReleaseByTag({
                owner, repo, tag,
              })).data;
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              await github.rest.git.deleteRef({ owner, repo, ref: 'tags/' + tag });
              core.notice('Removed ' + tag + ' preview');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('No preview release to remove');
            }
